<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reflection Search</title>
<style>*{box-sizing:border-box}body{margin:0;background:#020617;color:#f1f5f9;font-family:system-ui,sans-serif;min-height:100vh}header{position:sticky;top:0;z-index:10;background:rgba(15,23,42,.95);border-bottom:1px solid #1e293b;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}h1{font-size:18px;font-weight:700;margin:0 8px 0 0;white-space:nowrap}form{display:flex;gap:8px;flex:1;min-width:200px;max-width:640px}input,select{background:#1e293b;border:1px solid #334155;color:#f1f5f9;border-radius:6px;padding:7px 12px;outline:none}input:focus{border-color:#0284c7}button{background:#1e293b;border:1px solid #334155;color:#f1f5f9;border-radius:6px;padding:7px 12px;cursor:pointer}button:hover{background:#334155}button.primary{background:#0284c7;border-color:#0284c7;font-weight:600}button.primary:hover{background:#0ea5e9}#err{padding:8px 16px 0;color:#f87171;font-size:13px}#ad{padding:8px 16px 0}main{display:flex;gap:12px;overflow-x:auto;padding:16px;align-items:flex-start}main::-webkit-scrollbar,ul::-webkit-scrollbar{height:8px;width:6px}main::-webkit-scrollbar-thumb,ul::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}.col{width:340px;min-width:340px;max-height:calc(100vh - 140px);background:#0f172a;border:1px solid #1e293b;border-radius:8px;display:flex;flex-direction:column;overflow:hidden}.colhead{padding:8px 12px;background:rgba(30,41,59,.7);border-bottom:1px solid #334155;display:flex;align-items:center;gap:8px;cursor:move}.colhead h2{font-size:15px;margin:0;flex:1}.grip,.x{color:#64748b;background:none;border:none;padding:0 4px}.x:hover{color:#f87171}.col ul{overflow-y:auto;padding:8px;margin:0;list-style:none;display:flex;flex-direction:column;gap:8px}.card{background:rgba(30,41,59,.6);border-radius:6px;padding:8px}.card:hover{background:#1e293b}.card a{color:#38bdf8;font-size:13px;font-weight:600;text-decoration:none}.card a:hover{text-decoration:underline}.card p{color:#94a3b8;font-size:12px;margin:4px 0}.card span{color:#475569;font-size:11px}.empty{color:#475569;font-size:13px;padding:0 4px}aside{border:1px dashed #475569;border-radius:6px;padding:8px;font-size:12px;color:#94a3b8}.dragging{opacity:.4}</style></head>
<body>
<header>
<h1>Reflection Search</h1>
<form id="f"><input id="q" style="flex:1" placeholder="pretraga..." autofocus><button class="primary">Traži</button></form>
<select id="src"><option value="all">all</option><option value="brave">brave</option><option value="wikipedia">wikipedia</option><option value="openalex">openalex</option><option value="own-index">own-index</option></select>
<button id="add">+ Kolona</button>
</header>
<div id="err"></div>
<div id="ad"></div>
<main id="cols"></main>
<script src="search.js"></script>
</body></html>
